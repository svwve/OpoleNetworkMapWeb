<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opole Network Map - Zmiana hasła</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-bg">
    <main class="auth-container glass-panel">
        <div class="auth-header">
            <h1>Zmiana hasła</h1>
            <p>Potwierdź obecne hasło, aby ustawić nowe.</p>
        </div>
        <div id="password-change-error" class="alert hidden" role="alert"></div>
        <div id="password-change-success" class="alert alert-success hidden" role="status"></div>
        <form id="change-password-form">
            <div class="form-group">
                <label for="current-password">Obecne hasło</label>
                <input type="password" id="current-password" required maxlength="72" autocomplete="current-password">
            </div>
            <div class="form-group">
                <label for="new-password">Nowe hasło (minimum 8 znaków)</label>
                <input type="password" id="new-password" required minlength="8" maxlength="72" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary">Zmień hasło</button>
        </form>
        <div class="auth-switch">
            <a href="projects.html">Wróć do projektów</a>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
