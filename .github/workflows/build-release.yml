name: Build and Release

on:
  push:
    tags:
      - 'v*' # Uruchomienie akcji po utworzeniu taga np. v1.0.1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Wymagane do utworzenia release i wrzucenia pliku

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Create GitHub Release and Upload Jar
        uses: softprops/action-gh-release@v2
        with:
          files: target/OpoleNetworkMap.jar # Ścieżka do zbudowanego pliku .jar (dostosuj, jeśli nazwa w pom.xml jest inna)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
