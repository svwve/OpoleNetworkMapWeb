name: Build JavaFX App

on:
  push:
    branches: [ "main", "master" ] # Skrypt uruchomi się po wypchnięciu kodu na główną gałąź

jobs:
  build:
    strategy:
      matrix:
        # Definiujemy systemy, na których GitHub ma zbudować aplikację
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package

      - name: Run jpackage to create native installer
        run: |
          # Automatycznie wykrywa system i buduje odpowiednią paczkę
          jpackage --type app-image --name OpoleNetworkMap --input target --main-jar OpoleNetworkMap-1.0-SNAPSHOT.jar --main-class com.example.backend.Launcher
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            target/*.jar
            OpoleNetworkMap/
